version: 1.1.0
system: LG Display EMS Nexacro API Catalog (Grouped by Business Function)
total_endpoints: 50
exported_at: '2026-10-25T07:25:00+07:00'
functional_groups:
  Inventory & Spare Parts Core:
    directory: 01_inventory_spareparts
    title_vi: 01. Quản lý Tồn kho & Chi tiết Phụ tùng
    description_vi: Tra cứu tồn kho thực tế, tồn khả dụng, quy cách kỹ thuật, MTBF
      và lịch sử xuất dùng linh kiện.
    endpoint_count: 8
  Target Stock Optimization:
    directory: 02_target_stock_optimization
    title_vi: 02. Tối ưu hóa Định mức Tồn kho An toàn
    description_vi: Tính toán 93 thông số tồn kho mục tiêu, lead time, hệ số đệm buffer
      days và gợi ý mua bù tồn kho.
    endpoint_count: 4
  Procurement, RFQ & Orders:
    directory: 03_procurement_orders
    title_vi: 03. Mua sắm, Báo giá & Đơn hàng PO
    description_vi: Lập phiếu PRV, báo giá RFQ, quản lý đơn PO, đơn khẩn cấp Emergency
      PO và tra cứu đơn giá các site.
    endpoint_count: 14
  Work Orders & Maintenance:
    directory: 04_work_orders
    title_vi: 04. Bảo trì Thiết bị & Lệnh công tác
    description_vi: Khởi tạo form công tác WO, xuất dùng vật tư cho bảo trì, lịch
      sử trạng thái WO và mã thực thể WIP.
    endpoint_count: 4
  Electronic Approval Workflow:
    directory: 05_approval_workflow
    title_vi: 05. Quy trình Phê duyệt Điện tử
    description_vi: Tính toán luồng duyệt, kiểm tra cờ vượt mức phê duyệt (PLOverFlag)
      và gửi duyệt điện tử.
    endpoint_count: 5
  Common Master & Security:
    directory: 06_common_master_security
    title_vi: 06. Dữ liệu Dùng chung & Bảo mật Phân quyền
    description_vi: Từ điển mã combobox, popup tìm kiếm linh kiện, danh bạ nhân viên,
      phân quyền nút và phân quyền menu.
    endpoint_count: 13
  Audit Logging:
    directory: 07_audit_logging
    title_vi: 07. Nhật ký Hệ thống
    description_vi: Ghi nhận thời điểm bắt đầu thao tác màn hình (insertStartLog)
      và kết thúc phiên làm việc (updateEndLog).
    endpoint_count: 2
